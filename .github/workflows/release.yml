name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Check committed whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Package skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="work-to-skill-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix=work-to-skill/ \
            --output="dist/$asset" HEAD:skills/work-to-skill
          tar -tzf "dist/$asset" | grep -Fx 'work-to-skill/SKILL.md'
          (cd dist && sha256sum "$asset" > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/work-to-skill-${GITHUB_REF_NAME}.tar.gz" dist/SHA256SUMS \
            --verify-tag --title "work-skills ${GITHUB_REF_NAME}" --generate-notes
